<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{title}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="src/llm_optimizer/visualization/favicon-32x32.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
            <div id="root" class="w-screen min-h-screen"></div>

    <script type="module">
        // Import React, ReactDOM, and Lucide React components via ESM
        import React, { useEffect, useMemo, useRef, useState } from 'https://esm.sh/react@18?dev';
        import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
        import { BarChart3, Info, Copy, Settings } from 'https://esm.sh/lucide-react@0.363.0?bundle&deps=react@18&dev';
        import * as echarts from 'https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.esm.min.js';

        // Embedded data/config from backend
        const data = {data_json};
        const constraints = {constraints_json};
        const config = {config_json};
        const fieldOptions = {field_options_json};
        const fieldCategories = {field_categories_json};
        const defaults = {defaults_json};

        const colors = [
            '#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe',
            '#00f2fe', '#43e97b', '#38f9d7', '#fa709a', '#fee140'
        ];

        // Constraint configuration for custom constraints
        const CONSTRAINT_FIELDS = {
            'ttft': {
                label: 'TTFT',
                description: 'Time To First Token',
                options: [
                    { value: 'mean_ttft_ms', label: 'Mean TTFT' },
                    { value: 'median_ttft_ms', label: 'Median TTFT' },
                    { value: 'p95_ttft_ms', label: 'P95 TTFT' },
                    { value: 'p99_ttft_ms', label: 'P99 TTFT' }
                ]
            },
            'itl': {
                label: 'ITL',
                description: 'Inter-Token Latency',
                options: [
                    { value: 'mean_itl_ms', label: 'Mean ITL' },
                    { value: 'median_itl_ms', label: 'Median ITL' },
                    { value: 'p95_itl_ms', label: 'P95 ITL' },
                    { value: 'p99_itl_ms', label: 'P99 ITL' }
                ]
            },
            'e2e': {
                label: 'E2E',
                description: 'End-to-End Latency',
                options: [
                    { value: 'mean_e2e_latency_ms', label: 'Mean E2E' },
                    { value: 'median_e2e_latency_ms', label: 'Median E2E' },
                    { value: 'p95_e2e_latency_ms', label: 'P95 E2E' },
                    { value: 'p99_e2e_latency_ms', label: 'P99 E2E' }
                ]
            },
            'tpot': {
                label: 'TPOT',
                description: 'Time Per Output Token',
                options: [
                    { value: 'mean_tpot_ms', label: 'Mean TPOT' },
                    { value: 'median_tpot_ms', label: 'Median TPOT' },
                    { value: 'p95_tpot_ms', label: 'P95 TPOT' },
                    { value: 'p99_tpot_ms', label: 'P99 TPOT' }
                ]
            }
        };

        const OPERATORS = [
            { value: '<=', label: '≤ (at most)', description: 'Value must be less than or equal to' },
            { value: '>=', label: '≥ (at least)', description: 'Value must be greater than or equal to' },
            { value: '<', label: '< (less than)', description: 'Value must be strictly less than' },
            { value: '>', label: '> (greater than)', description: 'Value must be strictly greater than' }
        ];

        // Get relevant operators for a metric type
        function getRelevantOperators(metricName) {
            // All constraint fields are latency metrics, so only show < and <= operators
            return OPERATORS.filter(op => op.value === '<' || op.value === '<=');
        }

        function getParetoPoints(points) {
            const result = [];
            for (let i = 0; i < points.length; i++) {
                const p1 = points[i];
                let dominated = false;
                for (let j = 0; j < points.length; j++) {
                    if (i === j) continue;
                    const p2 = points[j];
                    const allGE = p2.x >= p1.x && p2.y >= p1.y;
                    const anyG = p2.x > p1.x || p2.y > p1.y;
                    if (allGE && anyG) { dominated = true; break; }
                }
                if (!dominated) result.push(p1);
            }
            return result;
        }

        function checkConstraints(point, dynamicConstraints) {
            const constraintsToCheck = dynamicConstraints || constraints;
            if (!constraintsToCheck || (Array.isArray(constraintsToCheck) && constraintsToCheck.length === 0)) return false;
            const getVal = (p, name) => {
                const src = p && typeof p === 'object' ? (p._raw || p) : {};
                return src[name];
            };
            const evalOp = (lhs, op, rhs) => {
                switch (op) {
                    case '>': return lhs > rhs;
                    case '>=': return lhs >= rhs;
                    case '<': return lhs < rhs;
                    case '<=': return lhs <= rhs;
                    case '==':
                    case '=': return lhs === rhs;
                    case '!=': return lhs !== rhs;
                    default: return true; // unknown op -> ignore
                }
            };
            if (Array.isArray(constraintsToCheck)) {
                return constraintsToCheck.every(c => {
                    if (!c || c.name == null) return true;
                    const lhs = Number(getVal(point, c.name));
                    const rhs = Number(c.value);
                    if (Number.isNaN(lhs) || Number.isNaN(rhs)) return false;
                    return evalOp(lhs, String(c.op || '>=').trim(), rhs);
                });
            }
            // Backward compatibility: object map {field: min}
            for (const [field, minVal] of Object.entries(constraintsToCheck)) {
                const lhs = Number(getVal(point, field));
                const rhs = Number(minVal);
                if (Number.isNaN(lhs) || Number.isNaN(rhs)) return false;
                if (!(lhs >= rhs)) return false;
            }
            return true;
        }

        // Helper function to get field labels for constraints
        function getFieldLabel(fieldName) {
            const field = config.fields?.[fieldName];
            if (field) return field.label;

            // Fallback to constraint field mapping
            for (const group of Object.values(CONSTRAINT_FIELDS)) {
                const option = group.options.find(opt => opt.value === fieldName);
                if (option) return option.label;
            }
            return fieldName;
        }

        function addConstraintLines(traces, xAxis, yAxis, transformedData) {
            if (!constraints) return;
            for (const [field, rawVal] of Object.entries(constraints)) {
                let v = rawVal;
                if (config.fields[field]?.category === 'latency') {
                    v = config.fields[field].unit === 'ms' ? (1000 / rawVal) : (1 / rawVal);
                }
                if (field === yAxis) {
                    const xMin = Math.min(...transformedData.map(d => d[xAxis]));
                    const xMax = Math.max(...transformedData.map(d => d[xAxis]));
                    const r = xMax - xMin;
                    traces.push({ x: [xMin - r * 0.1, xMax + r * 0.1], y: [v, v], mode: 'lines', type: 'scatter', line: { color: '#ef4444', width: 3, dash: 'dash' }, name: `Constraint: ${field} >= ${rawVal}`, hoverinfo: 'skip', showlegend: false });
                } else if (field === xAxis) {
                    const yMin = Math.min(...transformedData.map(d => d[yAxis]));
                    const yMax = Math.max(...transformedData.map(d => d[yAxis]));
                    const r = yMax - yMin;
                    traces.push({ x: [v, v], y: [yMin - r * 0.1, yMax + r * 0.1], mode: 'lines', type: 'scatter', line: { color: '#ef4444', width: 3, dash: 'dash' }, name: `Constraint: ${field} >= ${rawVal}`, hoverinfo: 'skip', showlegend: false });
                }
            }
        }

        function getAxisLabel(metric) {
            const f = config.fields?.[metric];
            if (!f) return metric;
            if (f.category === 'latency') return `1/${f.label} (tokens/s)`;
            return f.label + (f.unit ? ` (${f.unit})` : '');
        }

        function getXAxisLabel(metric) {
            const f = config.fields?.[metric];
            if (!f) return metric;
            const name = f.x_axis_name || f.label || metric;
            const unit = f.x_axis_unit || f.unit || '';
            return name + (unit ? ` (${unit})` : '');
        }

        function getYAxisLabel(metric) {
            const f = config.fields?.[metric];
            if (!f) return metric;
            // Keep original labeling for y-axis
            return f.label + (f.unit ? ` (${f.unit})` : '');
        }

        function generateHoverText(point) {
            if (!config.fields) return JSON.stringify(point, null, 2);
            const grouped = {};
            Object.entries(config.fields).forEach(([id, info]) => {
                if (point[id] === undefined) return;
                const cat = info.field_category || 'other';
                if (!grouped[cat]) grouped[cat] = [];
                const rawVal = point[id];
                const num = Number(rawVal);
                const value = isFinite(num) ? num.toFixed(2) : rawVal;
                const label = info.label;
                const unit = info.unit ? ` ${info.unit}` : '';
                grouped[cat].push({ label, value, unit });
            });

            // Compute inverse values and insert at the top of the Results group
            const derivedItems = [];
            Object.entries(config.fields).forEach(([id, info]) => {
                if (info?.x_axis_type !== 'inverse') return;
                const raw = point[id];
                const val = Number(raw);
                if (!isFinite(val) || val === 0) return;
                const inv = info.unit === 'ms' ? (1000 / val) : (1 / val);
                const label = info.x_axis_name || `1/${info.label}`;
                const unit = info.x_axis_unit || (info.unit === 'ms' ? 'tokens/s' : '1/' + (info.unit || 'units'));
                derivedItems.push({ label, value: inv.toFixed(2), unit: unit ? ` ${unit}` : '' });
            });
            if (derivedItems.length) {
                const resultsKey = fieldCategories?.results ? 'results' : (fieldCategories?.result ? 'result' : 'other');
                if (!grouped[resultsKey]) grouped[resultsKey] = [];
                grouped[resultsKey] = [...derivedItems, ...grouped[resultsKey]];
            }

            let text = '';
            Object.entries(grouped).forEach(([cat, fields]) => {
                const catLabel = fieldCategories?.[cat]?.label || cat;
                text += `<b>${catLabel}:</b><br>`;
                fields.forEach(({ label, value, unit }) => {
                    text += `  ${label}: ${value}${unit}<br>`;
                });
                text += '<br>';
            });
            return text;
        }

        function getLegendValues(dataset) {
            const colorBy = defaults?.colorBy || 'framework';
            const labels = Array.from(new Set(dataset.map(d => d[colorBy]).filter(v => v != null))).sort();
            const header = config.fields?.[colorBy]?.label || colorBy;
            return { field: colorBy, header, labels };
        }

        function formatFirstConstraints() {
            if (!constraints) return 'None';
            const fmt = (c) => {
                if (!c) return '';
                if (typeof c === 'object' && !Array.isArray(c)) {
                    if ('name' in c && 'value' in c) {
                        return `${c.name} ${c.op || '>='} ${c.value}`;
                    }
                }
                return String(c);
            };
            if (Array.isArray(constraints)) {
                const first = constraints[0];
                if (Array.isArray(first)) return first.map(fmt).filter(Boolean).join(', ');
                return fmt(first);
            }
            if (typeof constraints === 'object') {
                return Object.entries(constraints).map(([k, v]) => `${k} >= ${v}`).join(', ');
            }
            return String(constraints);
        }

        function formatConstraintsList() {
            if (!constraints) return [];
            const fmt = (c) => {
                if (!c) return '';
                if (typeof c === 'object' && !Array.isArray(c)) {
                    if ('name' in c && 'value' in c) return `${c.name} ${c.op || '>='} ${c.value}`;
                    return JSON.stringify(c);
                }
                return String(c);
            };
            if (Array.isArray(constraints)) {
                return constraints.map(fmt).filter(Boolean);
            }
            if (typeof constraints === 'object') {
                return Object.entries(constraints).map(([k, v]) => `${k} >= ${v}`);
            }
            return [String(constraints)];
        }

        // AddConstraintForm component for adding custom constraints
        function AddConstraintForm({ onAdd, onCancel }) {
            const [metric, setMetric] = useState('mean_ttft_ms');
            const [operator, setOperator] = useState('<=');
            const [value, setValue] = useState('');
            const [error, setError] = useState('');

            const relevantOperators = getRelevantOperators(metric);

            const handleAdd = () => {
                const numValue = parseFloat(value);
                if (isNaN(numValue) || numValue <= 0) {
                    setError('Please enter a valid positive number');
                    return;
                }

                const constraint = { name: metric, op: operator, value: numValue };
                onAdd(constraint);
                onCancel();
            };

            return React.createElement('div', { className: 'border border-blue-300 rounded-lg p-3 bg-blue-50 space-y-3' }, [
                React.createElement('div', { key: 'title', className: 'text-sm font-medium text-blue-900' }, 'Add Constraint'),
                React.createElement('div', { key: 'form', className: 'flex flex-wrap gap-2 items-end' }, [
                    // Metric dropdown
                    React.createElement('select', {
                        value: metric,
                        onChange: e => setMetric(e.target.value),
                        className: 'text-xs border border-gray-300 rounded px-2 py-1'
                    }, Object.values(CONSTRAINT_FIELDS).flatMap(group =>
                        group.options.map(opt =>
                            React.createElement('option', { key: opt.value, value: opt.value }, opt.label)
                        )
                    )),
                    // Operator dropdown
                    React.createElement('select', {
                        value: operator,
                        onChange: e => setOperator(e.target.value),
                        className: 'text-xs border border-gray-300 rounded px-2 py-1'
                    }, relevantOperators.map(op =>
                        React.createElement('option', { key: op.value, value: op.value }, op.label)
                    )),
                    // Value input
                    React.createElement('div', { className: 'flex items-center' }, [
                        React.createElement('input', {
                            type: 'number',
                            value: value,
                            onChange: e => setValue(e.target.value),
                            placeholder: '300',
                            className: 'text-xs border border-gray-300 rounded px-2 py-1 w-20'
                        }),
                        React.createElement('span', { className: 'text-xs text-gray-600 ml-1' }, 'ms')
                    ])
                ]),
                error && React.createElement('div', { key: 'error', className: 'text-xs text-red-600' }, error),
                React.createElement('div', { key: 'buttons', className: 'flex gap-2' }, [
                    React.createElement('button', {
                        onClick: onCancel,
                        className: 'text-xs px-3 py-1 border border-gray-300 rounded hover:bg-gray-50'
                    }, 'Cancel'),
                    React.createElement('button', {
                        onClick: handleAdd,
                        className: 'text-xs px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600'
                    }, 'Add')
                ])
            ]);
        }

        function useTransformedData(data, xAxis, yAxis) {
            return useMemo(() => {
                return data
                    .filter(p => p[xAxis] !== undefined && p[yAxis] !== undefined)
                    .map(p => {
                        const t = { ...p };
                        const f = config.fields?.[xAxis];
                        if (f?.category === 'latency' && p[xAxis] > 0) {
                            t[xAxis] = f.unit === 'ms' ? (1000 / p[xAxis]) : (1 / p[xAxis]);
                        }
                        // keep original values for tooltip
                        t._raw = p;
                        return t;
                    });
            }, [data, xAxis, yAxis]);
        }

        function Chart({ dataset, xAxis, yAxis, showLines, showPoints, onSelect, constraints: dynamicConstraints }) {
            const ref = useRef(null);
            useEffect(() => {
                if (!dataset || dataset.length === 0) {
                    if (ref.current) ref.current.innerHTML = '<p class="text-center text-slate-500 py-12">No valid data to display</p>';
                return;
            }

                const dom = ref.current;
                const chart = echarts.init(dom);

                const pts = dataset.map(d => ({ x: d[xAxis], y: d[yAxis], original: d }));
                const pareto = getParetoPoints(pts);
                const paretoSet = new Set(pareto.map(p => p.original));
                const paretoData = dataset.filter(d => paretoSet.has(d));
                const nonParetoData = dataset.filter(d => !paretoSet.has(d));

                const series = [];
            if (showLines && paretoData.length > 1) {
                    const sorted = [...paretoData].sort((a, b) => a[xAxis] - b[xAxis]);
                    series.push({
                        type: 'line', name: 'Pareto front', smooth: 0.2, symbol: 'none',
                        lineStyle: { color: '#0e7a66', width: 3 },
                        areaStyle: { color: 'rgba(16,185,129,0.06)' },
                        silent: true,
                        z: 0,
                        data: sorted.map(d => [d[xAxis], d[yAxis]])
                    });
                }
                if (showPoints) {
                    if (paretoData.length) {
                        const withC = paretoData.map(d => ({ d, ok: checkConstraints(d, dynamicConstraints) }));
                        const sat = withC.filter(p => p.ok).map(({ d }) => d);
                        const uns = withC.filter(p => !p.ok).map(({ d }) => d);
                        if (sat.length) series.push({
                            type: 'scatter', name: 'Pareto + Constraints', symbol: 'circle', symbolSize: 13,
                            zlevel: 3,
                            itemStyle: { color: '#10b981', borderColor: '#a7f3d0', borderWidth: 2 },
                            emphasis: { scale: 1.15, focus: 'series' },
                            tooltip: {
                                trigger: 'item',
                                backgroundColor: 'rgba(0,0,0,0)',
                                borderWidth: 0,
                                padding: 0,
                                extraCssText: 'background: linear-gradient(180deg, #22c55e 0%, #065f46 85%, #000000 100%); border-radius: 10px; padding: 12px; color: #ffffff;',
                                formatter: (p) => {
                                    const m = p.data && p.data.__meta;
                                    const txt = m ? generateHoverText(m.point) : '';
                                    const title = '<span style=\'color:#dcfce7;font-weight:800\'>Pareto ✓ (constraints)</span>';
                                    return `<div style=\'color:#ffffff;max-width:360px;letter-spacing:.2px\'>${title}<div style=\'margin-top:8px;\'>${txt}</div></div>`;
                                }
                            },
                            z: 3,
                            data: sat.map(d => ({ value: [d[xAxis], d[yAxis]], __row: d, tooltip: { formatter: () => generateHoverText(d._raw || d) } }))
                        });
                        if (uns.length) series.push({
                            type: 'scatter', name: 'Pareto', symbolSize: 13,
                            itemStyle: { color: '#0284c7', borderColor: '#fff', borderWidth: 2 },
                            emphasis: { scale: 1.05, focus: 'series' },
                            tooltip: {
                                trigger: 'item',
                                backgroundColor: 'rgba(0,0,0,0)',
                                borderWidth: 0,
                                padding: 0,
                                extraCssText: 'background: linear-gradient(180deg, #0ea5e9 0%, #0369a1 35%, #000000 100%); border-radius: 10px; padding: 12px; color: #ffffff;',
                                formatter: (p) => {
                                    const m = p.data && p.data.__meta;
                                    const txt = m ? generateHoverText(m.point) : '';
                                    const title = '<span style=\'color:#eafff7;font-weight:800\'>Pareto</span>';
                                    return `<div style=\'color:#ffffff;max-width:360px;letter-spacing:.2px\'>${title}<div style=\'margin-top:8px;\'>${txt}</div></div>`;
                                }
                            },
                            z: 2,
                            data: uns.map(d => ({ value: [d[xAxis], d[yAxis]], __row: d, tooltip: { formatter: () => generateHoverText(d._raw || d) } }))
                        });
                    }
                    if (nonParetoData.length) series.push({
                        type: 'scatter', name: 'Others', symbolSize: 10,
                        itemStyle: { color: '#94a3b8', borderColor: '#64748b', borderWidth: 1 },
                        emphasis: { scale: 1.05, focus: 'series' },
                        tooltip: {
                            trigger: 'item',
                            backgroundColor: 'rgba(0,0,0,0)',
                            borderWidth: 0,
                            padding: 0,
                            extraCssText: 'background: linear-gradient(180deg, #9ca3af 0%, #374151 90%, #1F2937 100%);border-radius: 10px; padding: 12px; color: #ffffff;',
                            formatter: (p) => { const m = p.data && p.data.__meta; const txt = m ? generateHoverText(m.point) : ''; const label = '<span style=\'color:#ffffff;font-weight:700\'>Non‑Pareto</span>'; return `<div style=\'color:#ffffff;max-width:320px\'>${label}<div style=\'margin-top:6px;\'>${txt}</div></div>`; }
                        },
                        z: 1,
                        data: nonParetoData.map(d => ({ value: [d[xAxis], d[yAxis]], __row: d, tooltip: { formatter: () => generateHoverText(d._raw || d) } }))
                    });
                }

                const option = {
                    backgroundColor: 'transparent',
                    grid: { left: 70, right: 40, top: 50, bottom: 50 },
                    xAxis: { name: getXAxisLabel(xAxis), nameLocation: 'middle', nameGap: 35, type: 'value', axisLabel: { color: '#000' }, nameTextStyle: { color: '#000' }, axisLine: { lineStyle: { color: '#000' } }, splitLine: { lineStyle: { color: '#e5e7eb' } } },
                    yAxis: { name: getYAxisLabel(yAxis), nameLocation: 'middle', nameGap: 45, type: 'value', axisLabel: { color: '#000' }, nameTextStyle: { color: '#000' }, axisLine: { lineStyle: { color: '#000' } }, splitLine: { lineStyle: { color: '#e5e7eb' } } },
                    tooltip: { trigger: 'item', backgroundColor: 'rgba(2,6,23,0.96)', textStyle: { color: '#ecfeff' }, borderWidth: 0, confine: true, transitionDuration: 0.05 },
                    series
                };

                chart.setOption(option);
                const onResize = () => chart.resize();
                window.addEventListener('resize', onResize);
                let ro;
                if ('ResizeObserver' in window) {
                    ro = new ResizeObserver(() => chart.resize());
                    ro.observe(dom);
                }
                // Click to select table row by x,y values
                chart.on('click', (p) => {
                    if (typeof onSelect !== 'function') return;
                    const v = Array.isArray(p?.value) ? p.value : (p?.data && Array.isArray(p.data.value) ? p.data.value : null);
                    if (v && v.length >= 2) {
                        onSelect({ x: v[0], y: v[1] });
                    }
                });
                return () => {
                    window.removeEventListener('resize', onResize);
                    if (ro) ro.disconnect();
                    chart.dispose();
                };
            }, [dataset, xAxis, yAxis, showLines, showPoints, dynamicConstraints]);

            return React.createElement('div', { ref, className: 'w-full h-[65vh] min-h-[420px] overflow-visible' });
        }

        function Controls({ xAxis, yAxis, showLines, showPoints, onChange, fieldOptions, customConstraints, setCustomConstraints, showAddForm, setShowAddForm, disabledOriginalConstraints, setDisabledOriginalConstraints }) {
            function selectOptions(id) {
                const groups = [];
                Object.entries(fieldOptions).forEach(([categoryId, categoryInfo]) => {
                    const options = [];
                    Object.entries(categoryInfo.fields).forEach(([fieldId, fieldInfo]) => {
                        if (id === 'xAxis') {
                            // Only show fields with non-empty x_axis_name
                            const hasXAxisName = fieldInfo && String(fieldInfo.x_axis_name || '').trim().length > 0;
                            if (!hasXAxisName) return;
                            // Optional: still constrain to latency category if present in config
                            if (categoryId !== 'latency') return;
                            const label = fieldInfo.x_axis_name || fieldInfo.label || fieldId;
                            const unit = fieldInfo.x_axis_unit || fieldInfo.unit || '';
                            options.push(
                                React.createElement('option', { key: fieldId, value: fieldId, disabled: !!fieldInfo.disabled }, `${label}${unit ? ' (' + unit + ')' : ''}${fieldInfo.disabled ? ' (No data)' : ''}`)
                            );
                            return;
                        }
                        if (id === 'yAxis' && categoryId !== 'performance') return;
                        options.push(
                            React.createElement('option', { key: fieldId, value: fieldId, disabled: !!fieldInfo.disabled }, `${fieldInfo.label}${fieldInfo.unit ? ' (' + fieldInfo.unit + ')' : ''}${fieldInfo.disabled ? ' (No data)' : ''}`)
                        );
                    });
                    if (options.length) {
                        groups.push(React.createElement('optgroup', { key: categoryId, label: categoryInfo.label }, options));
                    }
                });
                return groups;
            }

            return React.createElement('div', { className: 'bg-slate-100 border border-slate-200 rounded-xl p-5' }, [
                React.createElement('div', { key: 'grid', className: 'grid grid-cols-1 md:grid-cols-12 gap-5 items-start min-w-0' }, [
                    // X
                    React.createElement('div', { key: 'x', className: 'flex flex-col gap-3 md:col-span-4 min-w-0' }, [
                        React.createElement('label', { className: 'uppercase text-[12px] tracking-wide text-slate-700 font-semibold' }, 'X-Axis'),
                        React.createElement('select', { id: 'xAxis', value: xAxis, onChange: e => onChange({ xAxis: e.target.value }), className: 'w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-400' }, selectOptions('xAxis')),
                        React.createElement('div', { className: 'text-xs text-slate-500 italic' }, config.fields?.[xAxis]?.description || '')
                    ]),

                    // Y
                    React.createElement('div', { key: 'y', className: 'flex flex-col gap-3 md:col-span-4 min-w-0' }, [
                        React.createElement('label', { className: 'uppercase text-[12px] tracking-wide text-slate-700 font-semibold' }, 'Y-Axis'),
                        React.createElement('select', { id: 'yAxis', value: yAxis, onChange: e => onChange({ yAxis: e.target.value }), className: 'w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-400' }, selectOptions('yAxis')),
                        React.createElement('div', { className: 'text-xs text-slate-500 italic' }, config.fields?.[yAxis]?.description || '')
                    ]),

                    // Constraints (left of Display)
                    React.createElement('div', { key: 'constraints', className: 'flex flex-col md:col-span-2 min-w-0' }, [
                        React.createElement('div', { key: 'header', className: 'flex items-center justify-between mb-2' }, [
                            React.createElement('label', { className: 'uppercase text-[12px] tracking-wide text-slate-700 font-semibold' }, 'Constraints'),
                            React.createElement('button', {
                                onClick: () => setShowAddForm(!showAddForm),
                                className: 'text-xs bg-emerald-500 text-white px-2 py-1 rounded hover:bg-emerald-600 transition-colors'
                            }, showAddForm ? 'Cancel' : '+ Add')
                        ]),

                        // Add constraint form (when active)
                        showAddForm && React.createElement(AddConstraintForm, {
                            key: 'addForm',
                            onAdd: (constraint) => {
                                setCustomConstraints(prev => [...prev, constraint]);
                                setShowAddForm(false);
                            },
                            onCancel: () => setShowAddForm(false)
                        }),

                        // Constraint list
                        React.createElement('div', { key: 'list', className: 'space-y-1 text-xs max-h-20 overflow-y-auto' }, [
                            // Original constraints (now removable)
                            formatConstraintsList(constraints).length > 0 && [
                                React.createElement('div', { key: 'origLabel', className: 'text-gray-500 font-medium' }, '📊 From Benchmark:'),
                                ...formatConstraintsList(constraints).map((t, i) => {
                                    const isDisabled = disabledOriginalConstraints.includes(i);
                                    return React.createElement('div', { key: `orig-${i}`, className: `flex items-center justify-between px-2 py-1 rounded pl-4 ${isDisabled ? 'bg-gray-100 text-gray-400 line-through' : 'bg-gray-50 text-gray-600'}` }, [
                                        React.createElement('span', { key: 'text' }, t),
                                        React.createElement('button', {
                                            key: 'remove',
                                            onClick: () => {
                                                if (isDisabled) {
                                                    // Re-enable constraint
                                                    setDisabledOriginalConstraints(prev => prev.filter(idx => idx !== i));
                                                } else {
                                                    // Disable constraint
                                                    setDisabledOriginalConstraints(prev => [...prev, i]);
                                                }
                                            },
                                            className: `ml-2 rounded px-1 ${isDisabled ? 'text-green-500 hover:text-green-700 hover:bg-green-100' : 'text-red-500 hover:text-red-700 hover:bg-red-100'}`
                                        }, isDisabled ? '↻' : '×')
                                    ]);
                                })
                            ],
                            // Custom constraints (removable)
                            customConstraints.length > 0 && [
                                React.createElement('div', { key: 'customLabel', className: 'text-blue-700 font-medium mt-2' }, '✏️ Custom:'),
                                ...customConstraints.map((c, i) =>
                                    React.createElement('div', { key: `custom-${i}`, className: 'flex items-center justify-between bg-blue-100 px-2 py-1 rounded pl-4' }, [
                                        React.createElement('span', { key: 'text' }, `${getFieldLabel(c.name)} ${c.op} ${c.value}ms`),
                                        React.createElement('button', {
                                            key: 'remove',
                                            onClick: () => setCustomConstraints(prev => prev.filter((_, idx) => idx !== i)),
                                            className: 'text-red-500 hover:text-red-700 ml-2 hover:bg-red-100 rounded px-1'
                                        }, '×')
                                    ])
                                )
                            ],
                            // Empty state
                            (formatConstraintsList(constraints).length === 0 && customConstraints.length === 0) &&
                                React.createElement('div', { key: 'empty', className: 'text-gray-500 italic text-center py-2' }, 'No constraints')
                        ])
                    ]),

                    // Display
                    React.createElement('div', { key: 'd', className: 'flex flex-col gap-3 md:col-span-2 min-w-0' }, [
                        React.createElement('label', { className: 'uppercase text-[12px] tracking-wide text-slate-700 font-semibold' }, 'Display Options'),
                        React.createElement('label', { className: 'inline-flex items-center gap-2 text-slate-800 text-sm' }, [
                            React.createElement('input', { key: 'i1', type: 'checkbox', checked: showLines, onChange: e => onChange({ showLines: e.target.checked }), className: 'w-4 h-4 accent-indigo-500' }),
                            'Show Lines'
                        ]),
                        React.createElement('label', { className: 'inline-flex items-center gap-2 text-slate-800 text-sm' }, [
                            React.createElement('input', { key: 'i2', type: 'checkbox', checked: showPoints, onChange: e => onChange({ showPoints: e.target.checked }), className: 'w-4 h-4 accent-indigo-500' }),
                            'Show Points'
                        ])
                    ])
                ]),

                // Legend + constraints summary
                React.createElement('div', { key: 'legendSummary', className: 'mt-3 flex flex-col gap-2 text-xs text-slate-600' }, [
                    React.createElement('div', { key: 'pts', className: 'flex flex-wrap items-center gap-4' }, [
                        React.createElement('div', { key: 'lg1', className: 'flex items-center gap-2' }, [
                            React.createElement('span', { key: 'dot1', className: 'inline-block w-3 h-3 rounded-full', style: { backgroundColor: '#0284c7', border: '2px solid #ffffff' } }),
                            React.createElement('span', { key: 'txt1' }, 'Blue: Pareto points')
                        ]),
                        React.createElement('div', { key: 'lg2', className: 'flex items-center gap-2' }, [
                            React.createElement('span', { key: 'dot2', className: 'inline-block w-3 h-3 rounded-full', style: { backgroundColor: '#10b981', boxShadow: '0 0 0 2px #a7f3d0 inset' } }),
                            React.createElement('span', { key: 'txt2' }, 'Green: Pareto points that satisfy constraints')
                        ])
                    ]),
                    React.createElement('div', { key: 'paretoNote', className: 'text-[11px] text-slate-500' }, 'Pareto points lie on the frontier where no point can improve one objective without worsening the other.')
                ])
            ]);
        }

        function Legend({ dataset }) {
            const { header, labels } = useMemo(() => getLegendValues(dataset), [dataset]);
            return React.createElement('div', { className: 'bg-[#374151] border border-slate-600 rounded-xl p-4' }, [
                React.createElement('h3', { key: 'h', className: 'mb-3 text-base font-semibold tracking-wide text-slate-200' }, header || 'Legend'),
                React.createElement('div', { key: 'l', className: 'flex flex-col gap-2' }, labels.map((label, idx) => (
                    React.createElement('div', { key: label, className: 'flex items-center gap-2 px-1 py-1 rounded-lg border border-slate-600 bg-[#1f2937] text-slate-200' }, [
                        React.createElement('div', { key: 'c', className: 'w-3 h-3 rounded-full', style: { backgroundColor: colors[idx % colors.length] } }),
                        React.createElement('span', { key: 't', className: 'text-sm' }, label)
                    ])
                )))
            ]);
        }

        function SidebarFooter({ total }) {
            return React.createElement('div', { className: 'mt-auto flex flex-wrap gap-2 text-slate-400 text-xs' }, [
                React.createElement('div', { key: 'm', className: 'px-3 py-1 rounded-full bg-[#111827] border border-slate-700 text-slate-300' }, `Total Tests: ${total}`)
            ]);
        }

        function DataTable({ dataset, onlyPareto = false, xAxis, yAxis, selectedPoint }) {
            const filtered = useMemo(() => {
                if (!onlyPareto) return dataset;
                // recompute pareto based on current axes
                if (!dataset || dataset.length === 0) return [];
                const pts = dataset.map(d => ({ x: d[xAxis], y: d[yAxis], original: d }));
                const p = getParetoPoints(pts);
                const set = new Set(p.map(i => i.original));
                return dataset.filter(d => set.has(d));
            }, [dataset, onlyPareto, xAxis, yAxis]);

            const allFields = useMemo(() => {
                const s = new Set();
                filtered.forEach(p => Object.keys(p).forEach(k => s.add(k)));
                return Array.from(s).sort();
            }, [filtered]);

            // Filter out latency and throughput-related fields for the table view
            const visibleFields = useMemo(() => {
                return allFields.filter(f => {
                    // ignore internal/meta fields
                    if (typeof f === 'string' && f.startsWith('_')) return false;
                    const info = config.fields?.[f];
                    // show only fields known in config
                    if (!info) return false;
                    const cat = info.category || info.field_category;
                    if (cat === 'latency' || cat === 'performance') return false;
                    return true;
                });
            }, [allFields]);

            // Ensure tp_size is placed right after dp_size
            const orderedFields = useMemo(() => {
                const arr = [...visibleFields];
                const dpIdx = arr.indexOf('dp_size');
                const tpIdx = arr.indexOf('tp_size');
                if (tpIdx !== -1) {
                    const [tp] = arr.splice(tpIdx, 1);
                    const insertIdx = dpIdx !== -1 ? dpIdx + 1 : 0;
                    arr.splice(insertIdx, 0, tp);
                }
                return arr;
            }, [visibleFields]);

            // Sort rows by x-axis value (dataset already uses 1/x when needed)
            const sortedRows = useMemo(() => {
                const copy = [...filtered];
                copy.sort((a, b) => {
                    const ax = Number(a?.[xAxis] ?? 0);
                    const bx = Number(b?.[xAxis] ?? 0);
                    return ax - bx; // ascending
                });
                return copy;
            }, [filtered, xAxis]);

            // Build a stable key for row matching using numeric x/y with rounding
            const makeKey = (x, y) => {
                if (x == null || y == null) return null;
                const rx = Number(x).toFixed(6);
                const ry = Number(y).toFixed(6);
                return `${rx}|${ry}`;
            };
            const selectedKey = useMemo(() => makeKey(selectedPoint?.x, selectedPoint?.y), [selectedPoint, xAxis, yAxis]);

            // Scroll to selected row when it changes
            useEffect(() => {
                if (!selectedKey) return;
                const idx = sortedRows.findIndex(r => makeKey(r[xAxis], r[yAxis]) === selectedKey);
                if (idx >= 0) {
                    const el = document.getElementById(`row-${idx}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [selectedKey, sortedRows, xAxis, yAxis]);

            function copy(text, el) {
                navigator.clipboard.writeText(text).then(() => {
                    if (!el) return;
                    const prev = el.innerHTML;
                    el.innerHTML = '<span class="text-green-600">✓ Copied!</span>';
                    setTimeout(() => el.innerHTML = prev, 900);
                });
            }

            return React.createElement('div', { className: 'mt-4 overflow-x-auto max-w-full' }, [
                React.createElement('table', { key: 't', className: 'min-w-full text-sm border border-slate-200 rounded-lg overflow-hidden' }, [
                    React.createElement('thead', { key: 'h' }, [
                        React.createElement('tr', { key: 'r' }, orderedFields.map(f => (
                            React.createElement('th', { key: f, className: 'text-white px-3 py-2 text-left text-xs font-semibold whitespace-nowrap', style: { background: '#67a5a1 70%' } }, getAxisLabel(f))
                        )))
                    ]),
                    React.createElement('tbody', { key: 'b' }, sortedRows.map((row, idx) => (
                        React.createElement('tr', { key: idx, id: `row-${idx}`, className: (selectedKey && makeKey(row[xAxis], row[yAxis]) === selectedKey ? 'bg-teal-100 transition-colors' : 'odd:bg-white even:bg-slate-50 transition-colors') }, orderedFields.map(f => {
                            const v = row[f];
                            if (f === 'cmd') {
                                return React.createElement('td', { key: f, className: 'px-3 py-2 border-b border-slate-100' }, (
                                    React.createElement('div', { className: 'flex items-center justify-between cursor-pointer px-3 py-2 bg-slate-50 hover:bg-indigo-50 rounded-md border border-slate-200', onClick: (e) => copy(String(v), e.currentTarget), title: 'Click to copy' }, [
                                        React.createElement('span', { key: 't', className: 'font-mono text-xs text-slate-700 whitespace-nowrap flex-1' }, String(v)),
                                        React.createElement(Copy, { key: 'i', size: 14, className: 'text-slate-500 ml-2 shrink-0' })
                                    ])
                                ));
                            }
                            return React.createElement('td', { key: f, className: 'px-3 py-2 border-b border-slate-100 whitespace-nowrap' }, typeof v === 'number' ? v.toFixed(2) : (v ?? ''));
                        }))
                    )))
                ])
            ]);
        }

        function App() {
            const [xAxis, setXAxis] = useState(defaults?.xAxis || 'mean_e2e_latency_ms');
            const [yAxis, setYAxis] = useState(defaults?.yAxis || 'output_throughput');
            const [showLines, setShowLines] = useState(defaults?.showLines ?? true);
            const [showPoints, setShowPoints] = useState(defaults?.showPoints ?? true);
            const [selectedPoint, setSelectedPoint] = useState(null);

            // Custom constraints state management
            const [customConstraints, setCustomConstraints] = useState(() => {
                try {
                    const saved = localStorage.getItem('llm-optimizer-custom-constraints');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            const [showAddForm, setShowAddForm] = useState(false);

            // Track which original constraints are disabled
            const [disabledOriginalConstraints, setDisabledOriginalConstraints] = useState(() => {
                try {
                    const saved = localStorage.getItem('llm-optimizer-disabled-constraints');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            // Save to localStorage whenever customConstraints change
            useEffect(() => {
                try {
                    localStorage.setItem('llm-optimizer-custom-constraints', JSON.stringify(customConstraints));
                } catch (e) {
                    console.warn('Failed to save constraints to localStorage:', e);
                }
            }, [customConstraints]);

            // Save to localStorage whenever disabledOriginalConstraints change
            useEffect(() => {
                try {
                    localStorage.setItem('llm-optimizer-disabled-constraints', JSON.stringify(disabledOriginalConstraints));
                } catch (e) {
                    console.warn('Failed to save disabled constraints to localStorage:', e);
                }
            }, [disabledOriginalConstraints]);

            // Merge original and custom constraints, excluding disabled ones
            const effectiveConstraints = useMemo(() => {
                const original = constraints || [];
                const custom = customConstraints || [];

                // Filter out disabled original constraints
                let enabledOriginal = [];
                if (Array.isArray(original)) {
                    enabledOriginal = original.filter((constraint, index) =>
                        !disabledOriginalConstraints.includes(index)
                    );
                } else if (original && !disabledOriginalConstraints.includes(0)) {
                    enabledOriginal = [original];
                }

                return [...enabledOriginal, ...custom];
            }, [customConstraints, disabledOriginalConstraints]);

            const dataset = useTransformedData(data, xAxis, yAxis);

            return React.createElement('div', { className: 'flex flex-col w-screen min-h-screen' }, [
                // Header
                React.createElement('header', { key: 'top', className: 'bg-transparent text-slate-900' }, [
                    React.createElement('div', { key: 'container', className: 'max-w-[1400px] mx-auto w-full px-5 py-6' }, [
                        React.createElement('div', { key: 'titleWrap', className: 'w-full flex items-center justify-center' }, [
                            React.createElement('div', { key: 'title', className: 'text-2xl md:text-3xl font-bold tracking-tight' }, 'LLM Optimizer')
                        ])
                    ])
                ]),

                // Main
                React.createElement('main', { key: 'm', className: 'flex-1 overflow-visible max-w-full' }, [
                    React.createElement('div', { key: 'container', className: 'max-w-[1400px] mx-auto w-full p-5 flex flex-col gap-4' }, [
                        React.createElement('section', { key: 'hero', className: 'min-h-[78vh] flex flex-col gap-4 rounded-xl border border-slate-200 bg-white p-4' }, [
                            React.createElement(Controls, { key: 'ctrl', xAxis, yAxis, showLines, showPoints, fieldOptions, customConstraints, setCustomConstraints, showAddForm, setShowAddForm, disabledOriginalConstraints, setDisabledOriginalConstraints, onChange: (c) => { if (c.xAxis !== undefined) setXAxis(c.xAxis); if (c.yAxis !== undefined) setYAxis(c.yAxis); if (c.showLines !== undefined) setShowLines(c.showLines); if (c.showPoints !== undefined) setShowPoints(c.showPoints); } }),
                            React.createElement('div', { key: 'chartWrap', className: 'w-full' }, [
                                React.createElement(Chart, { key: 'c', dataset, xAxis, yAxis, showLines, showPoints, constraints: effectiveConstraints, onSelect: (pt) => setSelectedPoint(pt) })
                            ])
                        ]),
                        React.createElement('div', { key: 'tableWrap', className: 'overflow-visible' }, [
                            React.createElement('div', { key: 'tableScroller', className: 'overflow-visible' }, [
                                React.createElement(DataTable, { key: 'tbl', dataset, onlyPareto: true, xAxis, yAxis, selectedPoint })
                            ])
                        ])
                    ])
                ])
            ]);
        }

        createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
